<!doctype html>
<html lang="@html_language@">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>@welcome_customer_heading@ · @company_name@</title>
    </head>
    <body style="margin:0;padding:24px;background-color:#f5f7f4;color:#173a35;font-family:Arial,Helvetica,sans-serif;line-height:1.6;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
            <tr>
                <td align="center">
                    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;border:1px solid #e2e8e3;border-radius:12px;background-color:#ffffff;border-collapse:separate;">
                        <tr>
                            <td style="padding:32px;">
                                <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#176f52;">✳ grompil</p>
                                <p style="margin:0 0 8px;font-size:13px;text-transform:uppercase;color:#687b75;">@company_name@</p>
                                <h1 style="margin:0 0 24px;font-size:28px;line-height:1.25;">@welcome_customer_heading@</h1>
                                <p>@welcome_customer_greeting@ @customer_name@,</p>
                                <p>@welcome_customer_intro@</p>
                                <p>@welcome_customer_login_help@ <strong>@company_name@</strong>.</p>
                                <p style="margin:28px 0;">
                                    <a href="@login_url@" style="display:inline-block;padding:12px 22px;border-radius:6px;background-color:#176f52;color:#ffffff;text-decoration:none;font-weight:bold;">@login_title@</a>
                                </p>
                                <p style="margin:32px 0 0;font-size:13px;color:#687b75;">@welcome_customer_footer@</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
