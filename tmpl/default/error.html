<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>@error_title@ · Grompil</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="@_asset_base_href@assets/app.css">
        <style>
            body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
            .error-card { width: min(100%, 38rem); }
        </style>
    </head>
    <body class="bg-light">
        <main class="error-card card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-primary fw-semibold mb-2">Grompil</div>
                <h1 class="h3 mb-3">@error_title@</h1>
                <p class="text-secondary mb-4">@error_message@</p>
                <div class="alert alert-light border mb-4" role="status">
                    @error_reference_label@ <strong>#@error_code@</strong>
                </div>
                <button class="btn btn-primary" type="button" onclick="history.back()">@error_back_label@</button>
                <a class="btn btn-outline-secondary ms-2" href="index.php">@error_home_label@</a>
            </div>
        </main>
    </body>
</html>
