<!doctype html>
<html lang="@html_language@">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/svg+xml" href="@_asset_base_href@media/gromPilLogo.svg">
        <meta name="referrer" content="no-referrer">
        <title>@recovery_heading@ · Grompil</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="@_asset_base_href@assets/app.css">
    </head>
    <body class="login-page">
        <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
            <section class="login-card w-100">
                <div class="d-flex justify-content-between align-items-center">
                    <a class="brand" href="@recovery_login_link@"><span class="brandmark">✳</span> grompil</a>
                    @_language_selector_html@
                </div>
                <p class="eyebrow mt-4">@recovery_company_name@</p>
                <h1 class="h2">@recovery_heading@</h1>
                <p class="text-secondary">@recovery_description@</p>
                @_message_html@
                @_recovery_form_html@
                <a class="d-inline-block mt-3" href="@recovery_login_link@">@recovery_back_login@</a>
            </section>
        </main>
        <script src="@_asset_base_href@assets/language-selector.js"></script>
    </body>
</html>
