<aside class="cookie-footer" data-cookie-footer role="region" aria-label="@cookie_footer_heading@">
    <div class="container d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
        <div>
            <strong>@cookie_footer_heading@</strong>
            <p class="mb-0 mt-1">
                @cookie_footer_message@
            </p>
        </div>
        <button class="btn btn-sm btn-outline-secondary flex-shrink-0" type="button" data-cookie-footer-dismiss>@cookie_footer_close@</button>
    </div>
</aside>
