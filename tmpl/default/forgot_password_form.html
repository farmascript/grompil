<form method="post" action="@recovery_form_action@">
    @_csrf_field_html@
    <div class="mb-3">
        <label class="form-label" for="recovery-email">@email@</label>
        <input class="form-control" id="recovery-email" name="email" type="email" maxlength="254" autocomplete="email" required value="@email_value@">
    </div>
    <button class="btn btn-grompil w-100" type="submit">@recovery_send_link@</button>
</form>
