<!doctype html>
<html lang="@html_language@">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            @register_title@ · Grompil
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="@_asset_base_href@assets/app.css">
    </head>
    <body class="login-page">
        <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
            <section class="login-card w-100">
                <div class="d-flex justify-content-between align-items-center"><a class="brand" href="index.php"><span class="brandmark">✳</span> grompil</a>@_language_selector_html@</div>
                <h1 class="h2 mt-4">
                    @register_title@
                </h1>
                <div @_registration_content_hidden@>
                    <p class="text-secondary">
                        @register_intro@
                    </p>
                </div>
                @_message_html@
                <div @_registration_content_hidden@>
                <form method="post" action="register.php?c=@company_slug@" autocomplete="on">
                    @_csrf_field_html@
                    <input type="hidden" name="country_code" value="BE">
                    <fieldset class="mb-3">
                        <legend class="form-label">
                            @account_type@
                        </legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="type-customer" name="account_type" value="customer" @_customer_checked@>
                            <label class="form-check-label" for="type-customer">
                                @account_customer@
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="type-staff" name="account_type" value="staff" @_staff_checked@>
                            <label class="form-check-label" for="type-staff">
                                @account_staff@
                            </label>
                        </div>
                    </fieldset>
                    <div class="mb-3">
                        <label class="form-label" for="name-first">
                            @name_first@
                        </label>
                        <input class="form-control" id="name-first" name="name_first" maxlength="120" required value="@name_first_value@">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="name-last">
                            @name_last@
                        </label>
                        <input class="form-control" id="name-last" name="name_last" maxlength="120" required value="@name_last_value@">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">
                            @email@
                        </label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="254" required value="@email_value@">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="acronym">
                            @acronym@
                        </label>
                        <input class="form-control" id="acronym" name="acronym" maxlength="80" autocomplete="username" value="@acronym_value@">
                        <div class="form-text">
                            @acronym_help@
                        </div>
                    </div>
                    @_address_fields_html@
                    <div class="mb-3">
                        <label class="form-label" for="password">
                            @password@
                        </label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password-confirm">
                            @password_confirm@
                        </label>
                        <input class="form-control" id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" required>
                    </div>
                    <button class="btn btn-grompil btn-lg w-100" type="submit">@register_submit@</button>
                </form>
                <a class="d-inline-block mt-3" href="@login_link@">@login_title@</a>
                </div>
            </section>
        </main>
        @_cookie_footer_html@ <script src="@_asset_base_href@assets/address-lookup.js"></script><script src="@_asset_base_href@assets/cookie-footer.js?v=3"></script>
    </body>
</html>
