<main class="container-fluid py-4">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
        <div><h1 class="h2">@dispensing_history_title@</h1><p class="text-secondary mb-0">@dispensing_history_intro@</p></div>
        <a class="btn btn-outline-secondary" href="dispense.php">@dispensing_history_back_to_dispensing@</a>
    </div>
    <section class="card shadow-sm mb-3 dispensing-history-filter-card">
        <div class="card-body">
            <form method="get" action="dispensing-history.php" class="row g-2 align-items-end mb-0" data-dispensing-history-form data-language="@history_language@">
                <div class="col-12 col-xl-5">
                    <label class="form-label" for="history-query">@dispensing_history_search_label@</label>
                    <input class="form-control" id="history-query" type="search" name="q" value="@history_query_value@" maxlength="100" placeholder="@dispensing_history_search_placeholder@" data-dispensing-history-search data-minimum-message="@dispensing_history_search_minimum@">
                </div>
                <fieldset class="col-12 col-xl-4 border-0 p-0 m-0">
                    <legend class="form-label fs-6 mb-2">@dispensing_history_date_filter@</legend>
                    <div class="row g-2">
                        <div class="col-6"><label class="form-label small" for="history-date-from">@dispensing_history_date_from@</label><input class="form-control" id="history-date-from" type="date" name="date_from" value="@history_date_from_value@" data-history-date-from></div>
                        <div class="col-6"><label class="form-label small" for="history-date-to">@dispensing_history_date_to@</label><input class="form-control" id="history-date-to" type="date" name="date_to" value="@history_date_to_value@" data-history-date-to></div>
                    </div>
                </fieldset>
                <div class="col-6 col-sm-4 col-xl-2">
                    <label class="form-label" for="history-per-page">@dispensing_history_per_page@</label>
                    <select class="form-select" id="history-per-page" name="per_page">
                        <option value="10"@history_per_page_10_selected@>10</option>
                        <option value="25"@history_per_page_25_selected@>25</option>
                        <option value="50"@history_per_page_50_selected@>50</option>
                        <option value="100"@history_per_page_100_selected@>100</option>
                    </select>
                </div>
                <div class="col-6 col-sm-4 col-xl-auto"><button class="btn btn-primary" type="submit">@dispensing_history_search_button@</button></div>
            </form>
        </div>
    </section>
    <section class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mb-2">
                <span class="small text-secondary" data-history-count data-count-template="@history_count_template@" data-date-range-error="@dispensing_history_date_range_error@">@history_count_label@</span>
                <div data-history-pagination data-first="@dispensing_history_first@" data-previous="@dispensing_history_previous@" data-next="@dispensing_history_next@" data-last="@dispensing_history_last@">@_history_pagination_html@</div>
            </div>
            <div data-history-groups
                 data-empty-message="@dispensing_history_empty@"
                 data-error-message="@dispensing_history_unavailable@"
                 data-date-label="@dispensing_history_date@"
                 data-session-label="@dispensing_history_session@"
                 data-prescription-label="@dispensing_history_prescription_number@"
                 data-recipient-label="@dispensing_history_recipient@"
                 data-status-label="@dispensing_history_status@"
                 data-cnk-label="@dispensing_history_cnk@"
                 data-product-label="@dispensing_history_product@"
                 data-quantity-label="@dispensing_history_quantity@">@_history_groups_html@</div>
        </div>
    </section>
</main>
<script src="@history_script_url@" defer></script>
