<div class="col-12" data-address-fields data-address-country="@address_country_code_value@">
    <p class="form-label mb-1">@address_title@</p>
    <div class="form-text mb-2">@address_lookup_flow_help@</div>
    <div class="form-text mb-2 d-none" data-address-status data-no-results="@address_lookup_no_results@" data-postal-reminder="@address_postal_reminder@" data-select-required="@address_select_required@" data-manual-prompt="@address_manual_prompt@" data-manual-required="@address_manual_required@" aria-live="polite"></div>
    <input type="hidden" name="address_reference_id" data-address-reference-id value="@address_reference_id_value@">
    <input type="hidden" name="lambert72_x" data-address-coordinate="lambert72_x" value="@lambert72_x_value@">
    <input type="hidden" name="lambert72_y" data-address-coordinate="lambert72_y" value="@lambert72_y_value@">
    <input type="hidden" name="wgs84_latitude" data-address-coordinate="wgs84_latitude" value="@wgs84_latitude_value@">
    <input type="hidden" name="wgs84_longitude" data-address-coordinate="wgs84_longitude" value="@wgs84_longitude_value@">
    <input type="hidden" data-address-street-id value="@street_reference_id_value@">
    <input type="hidden" data-address-nis-code value="">
    <div class="row g-3">
        <div class="col-md-8">
            <label class="form-label" for="@address_prefix@-city">@company_city_label@</label>
            <input class="form-control" id="@address_prefix@-city" name="city" maxlength="100" autocomplete="address-level2" data-address-role="city" value="@city_value@">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="@address_prefix@-postal">@company_postal_code@</label>
            <input class="form-control" id="@address_prefix@-postal" name="postal_code" maxlength="20" autocomplete="postal-code" data-address-role="postal" value="@postal_code_value@">
        </div>
        <div class="col-md-7">
            <label class="form-label" for="@address_prefix@-street">@company_street@</label>
            <input class="form-control" id="@address_prefix@-street" name="street" maxlength="160" autocomplete="address-line1" data-address-role="street" value="@street_value@">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="@address_prefix@-house">@address_house_number@</label>
            <input class="form-control" id="@address_prefix@-house" name="house_number" maxlength="32" data-address-role="house" value="@house_number_value@">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="@address_prefix@-box">@address_box_number@</label>
            <input class="form-control" id="@address_prefix@-box" name="box_number" maxlength="32" data-address-role="box" value="@box_number_value@">
        </div>
    </div>
    <div class="form-check mt-2 d-none" data-address-manual-wrap>
        <input class="form-check-input" type="checkbox" id="@address_prefix@-manual-confirm" name="manual_address_without_coordinates" value="1" data-address-manual-confirm>
        <label class="form-check-label" for="@address_prefix@-manual-confirm">@address_manual_confirm@</label>
    </div>
</div>
