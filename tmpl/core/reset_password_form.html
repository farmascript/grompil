<form method="post" action="@recovery_form_action@">
    @_csrf_field_html@
    <div class="mb-3">
        <label class="form-label" for="recovery-password">@password_new_label@</label>
        <input class="form-control" id="recovery-password" name="password" type="password" minlength="12" maxlength="4096" autocomplete="new-password" required>
        <p class="form-text">@recovery_password_help@</p>
    </div>
    <div class="mb-3">
        <label class="form-label" for="recovery-confirm">@password_confirm@</label>
        <input class="form-control" id="recovery-confirm" name="password_confirm" type="password" minlength="12" maxlength="4096" autocomplete="new-password" required>
    </div>
    <button class="btn btn-grompil w-100" type="submit">@recovery_save_password@</button>
</form>
