<tr>
    <th scope="row"><kbd>@shortcut_key_label@</kbd></th>
    <td><select class="form-select" name="shortcuts[@shortcut_key_code@][action_key]">@_shortcut_action_options_html@</select></td>
    <td><input class="form-control" type="text" maxlength="80" name="shortcuts[@shortcut_key_code@][title]" value="@shortcut_title_value@" aria-label="@platform_dispensing_shortcuts_title_label@ @shortcut_key_label@"></td>
    <td><input class="form-control" type="text" maxlength="250" name="shortcuts[@shortcut_key_code@][tooltip]" value="@shortcut_tooltip_value@" aria-label="@platform_dispensing_shortcuts_tooltip@ @shortcut_key_label@"></td>
</tr>
