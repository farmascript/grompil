<tr data-shortcut-row>
    <th scope="row"><kbd>@shortcut_key_label@</kbd></th>
    <td>
        <select class="form-select mb-1" name="shortcuts[@shortcut_key_code@][action_key]">@_shortcut_action_options_html@</select>
        <div class="@shortcut_module_target_visibility@" data-module-target-wrap>
            <input class="form-control form-control-sm" type="text" name="shortcuts[@shortcut_key_code@][module_target]" value="@shortcut_module_target_value@" list="@shortcut_module_target_list@" placeholder="@platform_dispensing_shortcuts_module_target@" aria-label="@shortcut_module_target_aria_label@">
            <small class="text-secondary">@platform_dispensing_shortcuts_module_targets_help@</small>
        </div>
        <div class="@shortcut_url_target_visibility@" data-url-target-wrap>
            <input class="form-control form-control-sm mb-1" type="text" name="shortcuts[@shortcut_key_code@][url_target]" value="@shortcut_url_target_value@" maxlength="2048" placeholder="@shortcut_url_target_placeholder@" aria-label="@shortcut_url_target_aria_label@">
            <label class="form-check form-check-inline mb-0"><input class="form-check-input" type="checkbox" name="shortcuts[@shortcut_key_code@][new_tab]" value="1"@shortcut_new_tab_checked@> <span class="form-check-label">@platform_dispensing_shortcuts_new_tab@</span></label>
            <small class="text-secondary d-block">@platform_dispensing_shortcuts_url_help@</small>
        </div>
    </td>
    <td><input class="form-control" type="text" maxlength="80" name="shortcuts[@shortcut_key_code@][title]" value="@shortcut_title_value@" placeholder="@shortcut_title_placeholder@" aria-label="@platform_dispensing_shortcuts_title_label@ @shortcut_key_label@"></td>
    <td><input class="form-control" type="text" maxlength="250" name="shortcuts[@shortcut_key_code@][tooltip]" value="@shortcut_tooltip_value@" placeholder="@shortcut_tooltip_placeholder@" aria-label="@platform_dispensing_shortcuts_tooltip@ @shortcut_key_label@"></td>
</tr>
