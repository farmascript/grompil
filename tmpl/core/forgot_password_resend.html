<form method="post" action="@recovery_form_action@">
    @_csrf_field_html@
    <input type="hidden" name="email" value="@email_value@">
    <button class="btn btn-grompil w-100" type="submit" @resend_disabled@ data-wait-seconds="@wait_seconds@">@recovery_resend_button@</button>
    @_recovery_wait_html@
</form>
<script>
    (() => {
        const button = document.querySelector('button[data-wait-seconds]');
        const waitSeconds = Number(button?.dataset.waitSeconds || 0);
        if (button && waitSeconds > 0) {
            window.setTimeout(() => {
                button.disabled = false;
                document.getElementById('recovery-resend-wait')?.remove();
            }, waitSeconds * 1000);
        }
    })();
</script>
