<nav class="dispense-function-bar" aria-label="@dispensing_shortcuts_bar_aria@" data-function-bar>
    <div class="dispense-function-bar__hint">@dispensing_shortcuts_bar_help@</div>
    <div class="dispense-function-bar__touch-controls d-none" role="group" aria-label="@dispensing_shortcuts_touch_layers_aria@" data-function-layer-controls>
        <button class="dispense-function-bar__layer-select is-active" type="button" data-select-function-layer="normal" aria-pressed="true">@dispensing_shortcuts_layer_normal@</button>
        <button class="dispense-function-bar__layer-select" type="button" data-select-function-layer="ctrl" aria-pressed="false">@dispensing_shortcuts_layer_ctrl@</button>
        <button class="dispense-function-bar__layer-select" type="button" data-select-function-layer="shift" aria-pressed="false">@dispensing_shortcuts_layer_shift@</button>
    </div>
    <div class="dispense-function-bar__layers">
        <div class="dispense-function-bar__layer" data-function-layer="normal">@_normal_function_keys_html@</div>
        <div class="dispense-function-bar__layer d-none" data-function-layer="ctrl">@_ctrl_function_keys_html@</div>
        <div class="dispense-function-bar__layer d-none" data-function-layer="shift">@_shift_function_keys_html@</div>
    </div>
</nav>
