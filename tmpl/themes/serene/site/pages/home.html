<main class="serene-main">
    <section class="serene-home-hero">
        <div class="container serene-container">
            <div class="serene-paper serene-home-card">
                <span class="serene-spark" aria-hidden="true">✳</span>
                <p class="serene-overline">@company_name@</p>
                <h1>@page_title@</h1>
                <div class="company-page-copy serene-copy serene-home-copy">
                    @_page_body_html@
                </div>
            </div>
            <div class="serene-orb serene-orb-one" aria-hidden="true"></div>
            <div class="serene-orb serene-orb-two" aria-hidden="true"></div>
        </div>
    </section>
</main>
