<html lang="nl" data-bs-theme="light">

<head>
    <meta charset="UTF-8">

    <title>@title_url@</title>

    <!-- Bootstrap CSS CDN -->
	<link href="@bt_link_stylesheet@" rel="stylesheet" integrity="@bt_styleSheetIntegrity@" crossorigin="anonymous">

	<link rel="icon" href="@favicon_saas_ico@" sizes="any">
	<link rel="icon" type="image/png" href="@favicon_saas_png@" sizes="52x52">
	<link rel="apple-touch-icon" href="@favicon_saas_png@" sizes="180x180">
    
	<style>
        /* Zorgt ervoor dat de footer altijd netjes onderaan blijft plakken */
        html, body {
            height: 100%;

        body {
            display: flex;
            flex-direction: column;
        }

            flex: 1 0 auto;
        }

<body class="bg-body-tertiary text-body">

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">@home@</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">@services@</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">@about_us@</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">@contact@</a></li>
