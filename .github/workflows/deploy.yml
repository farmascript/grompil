name: Snel PHP uploaden naar public_html

on:
  push:
    branches:
      - main  # De pipeline start zodra je code pusht of opslaat in de 'main' branch

jobs:
  deploy:
    name: Upload bestanden naar shared hosting
    runs-on: ubuntu-latest
    
    # Dit onderdrukt de Node.js waarschuwing op de GitHub servers
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
    steps:
    - name: Haal de nieuwste code op
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Dit zorgt ervoor dat alleen gewijzigde bestanden worden overgedragen

    - name: FTP Sync naar public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftps # Forceert een beveiligde verbinding over TLS
        local-dir: ./
        server-dir: public_html
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**

