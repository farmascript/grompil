<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grompil-bookmarks</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main>
        <h1>Grompil-bookmarks</h1>
        <p>Open de Grompil-URL-manager in een ingelogde tab en synchroniseer daarna de twee bookmarkmappen.</p>
        <button id="sync" type="button">Synchroniseren</button>
        <p class="note">De extensie vervangt bij synchronisatie alleen de inhoud van haar eigen mappen. Andere bookmarks blijven staan en schuiven op.</p>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
</body>
</html>
